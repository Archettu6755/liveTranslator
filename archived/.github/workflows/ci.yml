name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl-development:
    name: WSL-compatible development checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          python-version: "3.12.13"
          enable-cache: true
      - name: Run repository checks
        run: bash scripts/check.sh

  windows-client:
    name: Test and package the Windows client
    runs-on: windows-latest
    needs: wsl-development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          python-version: "3.12.13"
          enable-cache: true
      - name: Verify the committed lock file
        run: uv lock --project windows-client --check
      - name: Install locked test and package dependencies
        run: uv sync --project windows-client --frozen --group dev --group package
      - name: Run tests
        run: uv run --frozen --project windows-client pytest
      - name: Run Ruff
        run: uv run --frozen --project windows-client ruff check windows-client scripts
      - name: Check formatting
        run: uv run --frozen --project windows-client ruff format --check windows-client scripts
      - name: Run Pyright
        run: uv run --frozen --project windows-client pyright --project windows-client/pyproject.toml
      - name: Check repository contents
        run: uv run --frozen --project windows-client python scripts/check_repository.py .
      - name: Build and inspect the portable client
        shell: pwsh
        run: windows-client/packaging/build.ps1
      - name: Upload portable client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LiveTranslator-windows-x64-package
          path: |
            artifacts/LiveTranslator-windows-x64.zip
            artifacts/LiveTranslator-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
